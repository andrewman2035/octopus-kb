<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Octopus</title>
  <style>
    :root { color-scheme: light dark; --muted: #777; --ok: #2e7d32; --bad: #c62828; --wait: #b26a00; }
    body { font: 13px/1.45 -apple-system, "PingFang SC", sans-serif; width: 340px; margin: 0; padding: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    h1 { font-size: 15px; margin: 0; }
    button.link { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
    #status { padding: 6px 8px; border-radius: 6px; background: rgba(127, 127, 127, .12); margin-bottom: 10px; }
    #status.bad { color: var(--bad); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 7px 0; border-top: 1px solid rgba(127, 127, 127, .25); }
    .row { display: flex; gap: 6px; align-items: baseline; }
    .state { flex: none; font-size: 12px; font-weight: 600; }
    .state.done { color: var(--ok); }
    .state.failed { color: var(--bad); }
    .state.pending { color: var(--wait); }
    .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sub { color: var(--muted); margin-top: 2px; word-break: break-all; }
    .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
    #setup { margin-bottom: 10px; }
    #setup p { margin: 0 0 6px; }
    .cmd code { user-select: all; word-break: break-all; }
    button.copy { margin-left: 6px; font: inherit; font-size: 12px; }
    #open-settings { margin-top: 8px; font: inherit; }
    #save-area { margin-bottom: 10px; }
    #save-page { width: 100%; padding: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      border: 0; border-radius: 6px; background: var(--ok); color: #fff; }
    #save-page:disabled { background: rgba(127, 127, 127, .35); cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Octopus</h1>
    <button class="link" id="options" data-i18n="settings"></button>
  </header>
  <div id="save-area" hidden>
    <button type="button" id="save-page"></button>
    <div class="sub" id="save-reason" hidden></div>
  </div>
  <div id="status"></div>
  <div id="setup" hidden>
    <p data-i18n="setupHint"></p>
    <p class="cmd"><code>uv run octopus extension token --copy</code> <button type="button" class="copy" data-i18n="copyButton"></button></p>
    <button type="button" id="open-settings" data-i18n="openSettings"></button>
  </div>
  <ul id="list"></ul>
  <script src="messages.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
