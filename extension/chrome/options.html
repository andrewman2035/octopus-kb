<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Octopus</title>
  <style>
    :root { color-scheme: light dark; --muted: #777; --ok: #2e7d32; --bad: #c62828; }
    body { font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type=password], input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    .check { display: flex; gap: 6px; align-items: center; font-weight: normal; }
    .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    .note { color: var(--bad); font-size: 12px; margin: 4px 0 0; }
    button { margin-top: 18px; padding: 6px 18px; font: inherit; }
    .cmd { margin: 4px 0 0; font-size: 12px; }
    .cmd code { user-select: all; }
    button.copy { margin: 0 0 0 6px; padding: 1px 8px; font-size: 12px; }
    #status { margin-top: 10px; }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    h2 { font-size: 14px; margin: 24px 0 4px; }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>
  <label for="token" data-i18n="tokenLabel"></label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" aria-describedby="token-hint">
  <div>
    <p id="token-hint" class="hint" data-i18n="tokenHint"></p>
    <p class="cmd"><code>uv run octopus extension token --copy</code> <button type="button" class="copy" data-i18n="copyButton"></button></p>
    <p class="cmd"><span data-i18n="dockerHint"></span> <code>docker compose run --rm octopus extension token</code> <button type="button" class="copy" data-i18n="copyButton"></button></p>
  </div>
  <label for="port" data-i18n="portLabel"></label>
  <input id="port" type="number" min="1024" max="65535">
  <p class="hint" data-i18n="portHint"></p>
  <label class="check"><input id="telegram" type="checkbox"> <span data-i18n="telegramLabel"></span></label>
  <p class="hint" data-i18n="telegramHint"></p>
  <p class="note" id="telegram-note" hidden></p>
  <label for="uiLanguage" data-i18n="uiLanguageLabel"></label>
  <select id="uiLanguage">
    <option value="auto" data-i18n="uiAuto"></option>
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
  <button id="save" data-i18n="saveButton"></button>
  <div id="status"></div>
  <h2 data-i18n="shortcutLabel"></h2>
  <p class="hint" data-i18n="shortcutHint"></p>
  <p class="hint" id="shortcut-now"></p>
  <script src="messages.js"></script>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
