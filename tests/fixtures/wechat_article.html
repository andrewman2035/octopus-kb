  复利的力量
</h1>
<div id="meta_content"><a id="js_name">投资笔记</a></div>
<div class="rich_media_content" id="js_content" style="visibility: hidden;">
<section><p><span>复利是指投资的收益继续产生收益。时间越长，复利的效果越明显，这也是为什么很多人说复利是世界第八大奇迹。长期坚持投资的人，往往能在十年之后看到明显的差别。</span></p>
<p><span>第二段：</span><span>定投可以降低择时的难度。</span><br><span>每个月固定投入一笔钱，不去猜市场的高低点，让时间来完成剩下的工作。很多普通投资者正是靠着这样朴素的方法积累了财富。</span></p>
<p><br></p>
<p><span>第三段：保持耐心，远离频繁交易，减少手续费和情绪化决策带来的损失。复利需要的不是聪明，而是坚持。很多研究都表明，长期持有指数基金的收益，往往超过大多数频繁交易的投资者。</span></p>
</section>
